name: PocketPal Tools APK

on:
  push:
    branches: [codex/global-tools]
    paths:
      - App.tsx
      - index.js
      - src/**
      - android/**
      - patches/**
      - scripts/**
      - package.json
      - yarn.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Check lint
        run: yarn lint
      - name: Check types
        run: yarn typecheck
      - name: Run tests
        run: yarn test --runInBand --silent

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Make room for native build tools
        run: sudo rm -rf /usr/share/dotnet /opt/ghc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
          # The app uses integer compileSdk 37; current SDK packages use 37.0.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Select the native variants required by the payload manifest
        run: |
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"
      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk
      - name: Build standalone APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleProdRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee android-build.log
      - name: Verify native build variants and payload
        run: |
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          grep -qF "Building rnllama variants: $VARIANTS" android/android-build.log
          node scripts/verify-android-payload.js --apk android/app/build/outputs/apk/prod/release/app-prod-release.apk --report payload-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpal-tools-apk
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpal-tools-payload-report
          path: payload-report.txt
