name: PocketPal Tools Android QA

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Tools APK workflow run to test
        default: '42426531842'
        required: true

permissions:
  actions: read
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run || '42426531842' }}
      E2E_APP_PACKAGE: com.menachem.pocketpal.tools
      E2E_PLATFORM_VERSION: '11'
      E2E_DEVICE_UDID: emulator-5554
      E2E_FULL_RESET: 'true'
      E2E_MOCHA_TIMEOUT: '1200000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
          cache-dependency-path: e2e/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          corepack enable
          yarn install --frozen-lockfile
          if ! yarn --silent appium driver list --installed --json | grep -q '"uiautomator2"'; then
            yarn appium driver install --source=local ./node_modules/appium-uiautomator2-driver
          fi
      - name: Obtain the verified production APK and upstream installer
        run: |
          gh run watch "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name pocketpal-tools-apk --dir "$RUNNER_TEMP/tools-apk"
          echo "E2E_APP_PATH=$RUNNER_TEMP/tools-apk/app-prod-release.apk" >> "$GITHUB_ENV"
          echo "DEVICEFARM_SCREENSHOT_PATH=$RUNNER_TEMP/tools-qa/screenshots" >> "$GITHUB_ENV"
          curl -fL 'https://github.com/a-ghorbani/pocketpal-ai/releases/download/v1.22.1/app-prod-release.apk' -o "$RUNNER_TEMP/upstream.apk"
          echo "0c608581d360957cee3087553508295dbcd666e0d9fcda5df454ced3f9ff00b9  $RUNNER_TEMP/upstream.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Run production APK on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/upstream.apk"
            cd e2e
            yarn wdio run wdio.android.local.conf.ts --spec specs/features/global-tools.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-android-qa
          path: |
            ${{ runner.temp }}/tools-qa
            e2e/debug-output
