name: PocketPal Tools release APK

on:
  push:
    branches: [codex/global-tools]
    paths: [.github/workflows/tools-release-apk.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the already verified application and native sources
        run: |
          git diff --exit-code c4482f3cc0b599719af14e2ab5eb349214559028 HEAD -- App.tsx index.js src android package.json yarn.lock patches scripts
          git diff --exit-code 928a4d8bdc1c3a562b8ddb565f1e67b8c5f83809 HEAD -- yarn.lock patches android/build.gradle android/gradle.properties scripts/android-payload-manifest.json
      - name: Download the matching upstream CI native payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/a-ghorbani/pocketpal-ai/actions/artifacts/13593869294/zip > upstream-native.zip
          echo '085f87d50abfe5dd732b7ca60b87db4d7f7f5edc8ce14a9be75b1b141fc661c6  upstream-native.zip' | sha256sum --check
          unzip -q upstream-native.zip -d native-reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Verify and reuse the unchanged inference libraries
        run: |
          REFERENCE_APK=$(find native-reference -name '*.apk' -print -quit)
          test -n "$REFERENCE_APK"
          node scripts/verify-android-payload.js --apk "$REFERENCE_APK" --report upstream-payload-report.txt
          export REFERENCE_APK
          python3 - <<'PY'
          import os, pathlib, zipfile
          target = pathlib.Path('node_modules/llama.rn/android/src/main/jniLibs')
          with zipfile.ZipFile(os.environ['REFERENCE_APK']) as archive:
              for entry in archive.namelist():
                  parts = pathlib.PurePosixPath(entry).parts
                  if len(parts) != 3 or parts[0] != 'lib' or parts[1] not in ('arm64-v8a', 'x86_64'):
                      continue
                  name = parts[2]
                  # Rebuild JNI wrappers from the current patched source. Only
                  # reuse the unchanged core libraries from the exact base CI.
                  if not (name.startswith('librnllama') and 'jni' not in name):
                      continue
                  output = target / parts[1] / name
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(entry))
          PY
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$(node scripts/verify-android-payload.js --print-variants)" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build standalone APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease --no-daemon --max-workers=4 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify the complete native payload
        run: node scripts/verify-android-payload.js --apk android/app/build/outputs/apk/prod/release/app-prod-release.apk --report payload-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpal-tools-apk
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpal-tools-payload-report
          path: payload-report.txt
